<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voucher sandbox</title>
  </head>
  <body>
    <main>
      <h1>Voucher sandbox</h1>
      <form>
        <label for="voucher">Voucher code</label>
        <input id="voucher" name="voucher" aria-describedby="voucher-hint" required>
        <small id="voucher-hint">Example: save 10 becomes SAVE-10.</small>
        <button type="submit">Apply</button>
      </form>
      <p role="status"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
